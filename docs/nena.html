itle":"R.H_photography","app.error":"Basis foutmelding","header":{"nav":{"portfolio":"Mijn Portfolio","reviews":"Reviews","aboutme":"Over mij","pricing":"Tarieven","contact":"Contact"}},"portfolio":{"H1":"Mijn Portfolio","seeMorePhotos":"Bekijk meer foto's","ibiza":{"title":"Ibiza","description":"In 2025 ben ik met een paar vrienden naar Ibiza geweest, hier heb ik een enkele toffe foto's kunnen nemen. Het nachtleven echter niet. Er zijn wel wat leuke straatfotografie foto's uitgekomen waar ik best tevreden mee ben. :))"},"bo\u0026jasper":{"title":"Bo \u0026 Jasper","description":"Dit was een shoot van een prachtig koppel die graag wat unieke foto's wilde hebben van hun 2. In al die jaren die ze samen zijn, hadden ze nog nooit professionele foto's laten nemen. Dus ik heb mijn best gedaan om hun oprechte liefde voor elkaar vast te leggen. We zijn naar de abdij van Averbode gegaan voor een mooie herfstige achtergrond."},"kruiwagenkoers":{"title":"Kruiwagenkoers","description":"De kruiwagenkoers is een zeer gezellig lokaal evenement waar het de bedoeling is om met een zware kruiwagen een parcours af te leggen zo snel mogelijk. onderweg worden er ook verschillende gekke opdrachten uitgevoerd. Nu Simon had mij gevraagd om foto's te nemen van hun team tijdens dit evenement en de jeugdbeweging waar zijn broer bij zat die ook mee deed aan de koers."},"kvhvshoot1":{"title":"KVHV","description":"Ik heb al meerdere shoots gedaan voor de studentenvereniging KVHV in Antwerpen. Waaronder 2x fotoshoot van hun presidium en 1x een fotoshoot tijdens hun cantus. Ik heb een aantal leuke foto's er uit gekozen om hier te tonen."},"spanje":{"title":"Spanje","description":"Met een groepsreis van toch wel 13 man, heb ik toch ook wel een aantal leuke foto's kunnen nemen. Dit zijn enkele van mijn favorieten."},"charlotte":{"title":"Charlotte","description":"Op een vrij random moment besloot ik om mijn camera mee te nemen naar de paardjes van Charlotte. Hier heb ik een aantal leuke foto's kunnen maken van iets dat ik nog niet eerder had gedaan. Namelijk foto's maken van paarden. en zij samen met haar paarden natuurlijk."},"liesje":{"title":"Liesje","description":"Liesje gaf een feest voor haar vader die 50 jaar werd. Hiervoor wilde ze graag wat foto's laten nemen van de gasten en de sfeer. Dit is een kleine selectie van de foto's die ik toen heb gemaakt."},"picos":{"title":"Picos de Europa","description":"Een goed vriend van mij en ik zijn samen op een impulsieve trektocht gegaan met 3 dagen voor vertrek alles te beginnen plannen. Bleek een van de beste impulsieve keuzes ooit te zijn geweest. Tijdens deze trip naar de Picos de Europa heb ik deze prachtige landschappen kunnen vastleggen."},"nena":{"title":"Nena","description":"Ik wilde altijd al eens een fotoshoot proberen in de sneeuw. We zijn eigelijk naar een hele gewone locatie 'Beerzel berg' gegaan en hebben er het beste van gemaakt. De sneeuw maakte de omgeving oprecht mooi. In samenspraak met de kleding als contrast tegen het wit van de sneeuw zijn er echt, al zeg ik het zelf, geweldige foto's uitgekomen."}},"reviews":{"pageTitle":"Reviews","title":"Reviews","subtitle":"Wat klanten zeggen over mijn werk","review1":{"text":"Heel goede en snelle service! Foto's waren van zeer professionele kwaliteit en het was vlot communiceren met de fotograaf. Zeker aan te raden voor een fotoshoot!","type":"Portretfotografie \u0026 Evenement fotografie"},"review2":{"text":"Wat een fijne ervaring. Professioneel, creatief en met oog voor detail. We zijn ontzettend blij met het resultaat en raden hem zeker aan!","type":"Portretfotografie"},"review3":{"text":"De fotograaf liep sportief de volledige kruiwagenkoers (4,5 km) mee en legde alle momenten uitstekend vast, zonder dat we hem opmerkten. Als ploeg zijn we enorm blij met de prachtige foto's van ons, het event en de supporters.","type":"Evenement fotografie"},"review4":{"text":"Feest Liesje","type":"Evenement fotografie"},"review5":{"text":"Robin denkt enthousiast mee over de uitstraling van de foto’s en staat tegelijk open voor nieuwe ideeën. Dat, gecombineerd met zijn aangename aanpak, resulteert in prachtige beelden.","type":"Portretfotografie"},"stats":{"title":"Statistieken","total":"Tevreden klanten","rating":"Gemiddelde beoordeling","recommend":"Zou mij aanbevelen"},"cta":{"title":"Klaar om te beginnen?","subtitle":"Neem contact op en laten we samen iets moois creëren.","button":"Boek een Shoot"}},"about":{"pageTitle":"Over Mij","title":"Over Mij","subtitle1":"Fotograaf","subtitle2":"IT \u0026 software ontwikkelaar","subtitle3":"Abstracte muziekliefhebber \u0026 ambassadeur","subtitle4":"Trektocht \u0026 Natuurliefhebber","photography":{"title":"Fotografie","intro":"Zoals bij velen begint een passie voor fotografie vaak klein. Voor mij begon het met dat ik altijd degene was die alles graag vastlegde wat ik en mijn vrienden samen deden. Tijdens vakanties maakte ik ontzettend veel foto’s en op een gegeven moment dacht ik: nu is het tijd voor echt kwalitatieve fotos.","passion":"Ik heb dan sterk geinvesteerd in een degelijke camera en ben mezelf gaan verdiepen in de technieken achter fotografie met een volwaardige camera. Het meeste van wat ik geleerd heb is gewoon door te doen... dit is ook het leukste omdat je leert wat wel werkt en wat niet werkt. zonder gewoon blindelings instructies te volgen.","style":"Mijn stijl kenmerkt zich door gebruik te maken van altijd tussendoor fotos te nemen. hierdoor wanneer een persoon zich naar een bewuste pose werkt maak je eigelijk tussendoor de natuurlijkste fotos. Je merkt dan nog vaak dat er een niet geforceerde zit in de houding.","quote":"Experimenteren levent vaak tot de beste resultaten in mijn ervaring dus durf suggesties te doen of zelf met ideeen te komen! combinatie van ideeen van beide kanten leidt vaak tot de beste fotos."},"it":{"title":"IT \u0026 Ontwikkeling","intro":"Naast fotografie heb heb ook een passie voor technologie en IT. Ik ben graag bezig met nieuwe hardware \u0026 software technologieën.","website":"Bijvoorbeeld deze website, die heb ik volledig gecodeerd met moderne tools. Ik heb het gebouwd als een React-applicatie met behulp van:","blend":"Om deze reden ken ik ook best veel van de technische specificaties van camera's, lenzen en bodies. Hier ben ik mij recent enorm in gaan verdiepen. Ik help anderen ook graag bij het zoeken van de juiste hardware voor hun noden."},"music":{"title":"Abstracte Muziek","intro":"Ik luister zelf heel graag naar abstracte en vaak voor vele mensen brutte muziek. Voor een of andere reden geven deze apbrupte geluiden mij een gevoel van rust en geluk.","exploration":"Mijn favoriete genres zijn Drum \u0026 Bass \u0026 Dubstep: vaker nog de meer experimentele kanten en minder mainstream gekende subgenres. Om een paar voorbeelden te noemen: 'neurofunk', 'riddim'","connection":"Ik voelde mij zelf zo verbonden met deze muziek dat ik ambassadeur van een van het grooste eventmerken die dit soort muziek promoten 'Rampage' Hier heb ik gelijkdenkende mensen leren kennen die in deze extreme choas ook rust vinden. ","quote":"\"Het klinkt waarschijnlijk cliché maar het blijft echt een van de weinige plekken waar ik zonder overdrijven kan zeggen dat ik me echt zielsgelukkig voel.\""},"hike":{"title":"Trektocht \u0026 Natuur","intro":"Vreemd genoeg gaat mensen die een liefde hebben voor abstracte muziek vaak samen met een liefde voor de abstactheid in de natuur. Voor mij is dat net zoals velen ook zo.","exploration":"Ik ben iemand die mijzelf heel graag test, ik ga graag op uitndagende trektochten in de natuur waar ik mezelf fysiek en mentaal kan pushen. Dit geeft mij een gevoel van voldoening.","connection":"Door mijn camera ervaring leg ik deze momenten ook graag vast. Als je echt zo een perfecte compositie kan vinden in de natuur, dat vind ik echt geweldig. in mijn portfolio kan je een aantal van deze foto's terugvinden. ga maar eens kijken :)","quote":"\"Het even weg zijn van de beschaving heeft echt ie
